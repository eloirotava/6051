##################################################
# SSV6051P - configuracao lida pelo ssv6051.ko
# Instalar em /lib/firmware/ssv6051-wifi.cfg
# Formato: "chave = valor"; '#' comeca comentario.
##################################################

# MAC: com ignore_efuse_mac = 0 usa o MAC gravado no e-fuse do chip.
# mac_address_mode so vale se o e-fuse nao tiver MAC valido:
# 0 = MAC fixo 00:33:33:33:33:33, 1 = aleatorio a cada carga,
# 2 = aleatorio persistido em mac_output_path.
ignore_efuse_mac = 0
mac_address_mode = 1

# Cristal do modulo (24, 26 ou 40 MHz).
xtal_clock = 24

# Regulador interno: 0 = DCDC buck, 1 = LDO.
# As placas testadas (Amlogic S9xx e RK322x) calibram com LDO.
volt_regulator = 1

# Clock do SDIO depois do firmware (que sobe sempre a 25 MHz). Sem a
# chave, 25 MHz. No RK322x 50 MHz funciona; 37500000 (padrao antigo do
# fabricante) gera erros de CRC. Teste 50000000 em outras placas antes.
sdio_clock_hz = 50000000

# Radio: o 6051 e 2.4 GHz, 20 MHz, 1x1.
hw_cap_2ghz = on
hw_cap_5ghz = off
hw_cap_security = on
hw_cap_ap = off
hw_cap_p2p = off
#use_wpa2_only = 1

# 802.11n (MCS 0-7, 20 MHz). Funciona a partir da correcao das flags de RX
# (encoding/enc_flags) e do controle de taxa HT; antes, todo frame HT era
# entregue so ao monitor. Com HT desligado, sgi/gf/ampdu nao tem efeito.
# AMPDU TX agrega no host: um agregado por escrita SDIO (~2x na subida).
hw_cap_ht = on
hw_cap_gf = off
hw_cap_sgi_20 = on
hw_cap_sgi_40 = off
hw_cap_ampdu_rx = on
hw_cap_ampdu_tx = on

# Potencia de TX: indice na tabela wifi_tx_gain, 1 (maior) .. 14 (menor);
# 0 ou ausente = padrao do chip (6051P ~ nivel 2).
# 14 e o minimo: evita brownout em fontes fracas, mas encurta o alcance.
wifi_tx_gain_level_b = 14
wifi_tx_gain_level_gn = 14
